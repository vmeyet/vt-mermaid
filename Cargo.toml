[package]
name = "vt-mermaid"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Mermaid diagrams drawn as text on a vt-canvas grid."
license = "MIT"
readme = "README.md"
repository = "https://github.com/vmeyet/vt-mermaid"
keywords = ["mermaid", "diagram", "terminal", "flowchart", "ascii"]
categories = ["command-line-interface", "visualization", "text-processing"]
# The library and the inputs and snapshots its own tests read; the corpus, the oracle and the tests reading them stay
# in the repository.
include = [
  "/src/**/*.rs",
  "/src/**/snapshots/*a_diagram_draws_in_ascii_too.snap",
  "/src/graph/snapshots/*.snap",
  "/README.md",
  "/LICENSE",
  "/ARCHITECTURE.md",
  "/benches/inputs/fuzzed-er.mmd",
  "/tests/spike/cached.mmd",
  "/corpus/LICENSE-mermaid",
  "/corpus/flowchart/docs--config-theming--L155.mmd",
  "/corpus/flowchart/e2e--platform-dev-diagrams-layout-tests-life-choices.mmd",
  "/corpus/flowchart/e2e--platform-dev-diagrams-layout-tests-project-sox2.mmd",
  "/corpus/flowchart/e2e--platform-dev-diagrams-tmp-v12-0-0-faulty-diags-elk-legacy-preset-regression.mmd",
]

[lib]
name = "vt_mermaid"

[[example]]
name = "scoreboard"
path = "scoreboard/main.rs"
test = true

[[bench]]
name = "limits"
harness = false

[[bench]]
name = "corpus"
harness = false

[dependencies]
vt-canvas = "0.1.0"

[features]
# Exact measures of a drawing for scoreboard/, read from its geometry; unstable, not part of the API.
measure = []

# serde_json reads the oracle's results for examples/agreement.rs and scoreboard/, serde reads them into structs and writes the scoreboard's;
# mermaid-text is what examples/compare.rs and scoreboard/ measure against, pinned so the scoreboard compares one version; divan runs benches/limits.rs;
# mermaid-rs-renderer is the parser examples/agreement.rs compares with the oracle for every diagram kind.
[dev-dependencies]
divan = "0.1.21"
insta = "1.49.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
mermaid-text = "=0.58.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Turns the `measure` feature on for the scoreboard example, so `cargo clippy --all-targets` checks it.
vt-mermaid = { path = ".", features = ["measure"] }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
# cargo-fuzz builds with `--cfg fuzzing`, which adds each parser alone for fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Restriction lints the code already meets, kept so it stays that way.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
infinite_loop = "warn"
map_err_ignore = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_pass_by_ref_mut = "warn"
panic_in_result_fn = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
significant_drop_tightening = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
# Pedantic lints this code opts out of.
doc_markdown = "allow"
format_collect = "allow"
format_push_string = "allow"
implicit_hasher = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
