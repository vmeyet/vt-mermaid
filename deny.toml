[graph]
all-features = true

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained with no fixed release; it reaches us through mermaid-rs-renderer and fontdb, which vt-mermaid never lets load a font: the layout measures stand-in ASCII labels with fast metrics" },
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, no vulnerability known; it reaches us through mermaid-text, a dev-dependency only used by the comparison example" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
